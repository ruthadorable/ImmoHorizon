<nav aria-label="breadcrumb">
    @for(crumb of breadcrumbs; track crumb.url; let last = $last){
  <ng-container >
    @if(!last){
    <a
      [routerLink]="crumb.url">
      {{ crumb.label }}
    </a>}
    @if(last){
    <span >
      {{ crumb.label }}
    </span>}
    @if(!last){
    <span >
      /
    </span>}

  </ng-container>
}
</nav>
