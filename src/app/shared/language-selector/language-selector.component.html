<div class="language-selector">

  <button 
    class=" rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-white/5 hover:text-white"
    (click)="toggleDropdown()">

    {{ selectedLanguage }}

    <span class="arrow" [class.rotate]="isOpen">
      ▼
    </span>

  </button>


  <div 
    class="dropdown rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-white/5 hover:text-white"
    *ngIf="isOpen">

    <div
      class="option rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-white/5 hover:text-white"
      *ngFor="let lang of languages"
      (click)="selectLanguage(lang.code)">

      {{ lang.code }}

    </div>

  </div>

</div>
