<div class="bg-[#f8f8f8] min-h-screen">
  <button mat-button (click)="navBack()"><mat-icon><img src="./images/arrow_back_24dp_1F1F1F_FILL0_wght400_GRAD0_opsz24.png" /></mat-icon>Back</button>
  <!-- Breadcrumb -->
  <div class="max-w-7xl mx-auto px-6 py-4 text-sm text-gray-500">
    <app-breadcrumb></app-breadcrumb>
  </div>
  <!-- Title -->
        <section class="mx-20 ">

         
          <h3 class="text-3xl text-gray-700 font-semibold mb-4">
            {{ article.title }}
          </h3>

        </section>

  <!-- Gallery -->
 <!-- Gallery -->
<section class="max-w-7xl mx-auto px-6">

  <div
    class="relative group overflow-hidden rounded-xl bg-gray-100 h-[400px]"
  >

    <!-- Main Image -->
    
      <img 
      [src]="getImageUrl(article.image)"
      class="w-full h-full object-cover transition-all duration-500"
      >
     
  </div>

</section>

  <section class="max-w-7xl mx-auto px-6 py-8">

    <div class="grid grid-cols-12 gap-8" style="text-align: center;min-height: 15px;">

        <!-- Actions -->
        <div class="flex gap-6 mt-2 pb-2">

          <button
            mat-button
            class="icon-button"
          >
            <mat-icon>favorite_border</mat-icon>
            
          </button>

          <button
            mat-button
            class="icon-button"
          >
            <mat-icon>print</mat-icon>
            
          </button>

          <button
            mat-button
            class="icon-button"
          >
            <mat-icon>share</mat-icon>
            
          </button>

        </div>
    </div>

        <div
          class="w-full "
        >
        

        <!-- Description -->
        <section class="mx-20 ">

          <p class="leading-8 text-gray-700">
            {{ article.description }}
          </p>

        </section>

        <!-- Property Details -->
        <section class="mx-20 py-10">

          <button mat-button class="leading-4 text-blue-700" (click)="goTo(article.link)">
            {{article.link}}
          </button>

        </section>


      </div>

    

  </section>

</div>
