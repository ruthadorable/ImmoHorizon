<mat-toolbar
    color="primary"
    class="mat-elevation-z8 flex w-full items-center">

    <!-- Menu -->
    <button
        mat-icon-button
        (click)="drawer.toggle()"
        aria-label="Open navigation menu">

        <mat-icon>
            menu
        </mat-icon>

    </button>


    <!-- Title -->
    <span class="ml-2 truncate text-base font-medium sm:text-lg md:text-xl">
        Real Estate Agent Dashboard
    </span>


    <!-- Spacer -->
    <span class="flex-1"></span>


    <!-- Right side -->
    <div class="flex items-center gap-1 sm:gap-2 md:gap-4">

        <!-- Notifications -->
        <button
            mat-icon-button
            aria-label="Notifications">

            <mat-icon>
                notifications
            </mat-icon>

        </button>


        <!-- Messages -->
        <button
            mat-icon-button
            aria-label="Messages">

            <mat-icon>
                mail
            </mat-icon>

        </button>


        <!-- Employee -->
        <div class="flex items-center gap-2 sm:gap-3">

            <img
                src="https://i.pravatar.cc/150?img=5"
                class="h-8 w-8 rounded-full border-2 border-white sm:h-10 sm:w-10"
                alt="Employee">


            <!-- Employee information -->
            <div class="hidden md:block">

                <p class="truncate font-medium">
                    {{ getUsername() }}
                </p>

                <p class="text-xs opacity-80">
                    Real Estate Agent
                </p>

            </div>

        </div>

    </div>

</mat-toolbar>


<!-- Drawer -->
<mat-drawer-container
    autosize
    class="min-h-[calc(100vh-64px)]">


    <mat-drawer
         #drawer
    [mode]="isMobile ? 'over' : 'side'"
    [opened]="!isMobile"
    position="start">

        <app-sidenav></app-sidenav>

    </mat-drawer>


    <!-- Main content -->
    <mat-drawer-content class="w-full">

        <div class="min-h-[600px] w-full">

            <router-outlet></router-outlet>

        </div>

    </mat-drawer-content>

</mat-drawer-container>
