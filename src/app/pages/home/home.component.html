
<div class="min-h-full">
  

  <header class="relative bg-white shadow-sm">
    <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
      <h1 class="text-3xl font-bold tracking-tight text-gray-900">{{ 'Slogan' | translate }}</h1>
    </div>
  </header>
  <main>
    <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8 invert">
      <h2>{{ 'HOME.WELCOME' | translate }}</h2>
      <p>{{ 'HOME.DESCRIPTION' | translate }}</p>
    </div>
      <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
        <div class="jusity-center mt-5  p-10 flex">{{ 'HOME.FEATURED_PROPERTIES' | translate }}</div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          @for(property of featuredProperties;track property.id){
          <mat-card  class="bg-white shadow-md rounded-lg overflow-hidden">
            <img mat-card-image [src]="property.imageUrl" alt="{{ property.title }}" class="w-full h-48 object-cover">
            <div class="p-4">
              <h3 class="text-lg font-semibold">{{ property.title | translate }}</h3>
              <p class="text-gray-600">{{ property.description }}</p>
              <button mat-button color="primary" class="mt-2">{{ 'HOME.VIEW_DETAILS' | translate }}</button>
            </div>
          </mat-card>
          }
        </div>
      </div>
  </main>
</div>
