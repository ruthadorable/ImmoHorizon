name: Deploy to EC2

on:
  push:
    branches:
      - dev/backend

jobs:

  # ==========================================================
  # Deploy to EC2 #1
  # ==========================================================
  deploy-ec2-1:

    name: Deploy to EC2 #1

    runs-on: ubuntu-latest

    steps:

      - name: Deploy backend to EC2 #1
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ secrets.EC2_1_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m

          script: |

            set -e

            echo "========================================="
            echo "Deploying ImmoHorizon backend - EC2 #1"
            echo "========================================="

            cd ~/immohorizon

            echo "Pulling latest Docker image..."

            docker pull ruthann33/immohorizon-backend:latest

            echo "Stopping existing container..."

            docker stop immohorizon-backend || true

            echo "Removing existing container..."

            docker rm immohorizon-backend || true

            echo "Starting new container..."

            docker run -d \
              --name immohorizon-backend \
              --restart unless-stopped \
              -p 3030:3030 \
              --env-file ~/immohorizon/.env \
              ruthann33/immohorizon-backend:latest

            echo "Waiting for application to start..."

            sleep 15

            echo "Checking container..."

            docker ps

            echo "Checking container logs..."

            docker logs --tail 50 immohorizon-backend

            echo "EC2 #1 deployment completed."


  # ==========================================================
  # Deploy to EC2 #2
  # ==========================================================
  deploy-ec2-2:

    name: Deploy to EC2 #2

    runs-on: ubuntu-latest

    needs:
      - deploy-ec2-1

    steps:

      - name: Deploy backend to EC2 #2
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ secrets.EC2_2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m

          script: |

            set -e

            echo "========================================="
            echo "Deploying ImmoHorizon backend - EC2 #2"
            echo "========================================="

            cd ~/immohorizon

            echo "Pulling latest Docker image..."

            docker pull ruthann33/immohorizon-backend:latest

            echo "Stopping existing container..."

            docker stop immohorizon-backend || true

            echo "Removing existing container..."

            docker rm immohorizon-backend || true

            echo "Starting new container..."

            docker run -d \
              --name immohorizon-backend \
              --restart unless-stopped \
              -p 3030:3030 \
              --env-file .env \
              ruthann33/immohorizon-backend:latest

            echo "Waiting for application to start..."

            sleep 15

            echo "Checking container..."

            docker ps

            echo "Checking container logs..."

            docker logs --tail 50 immohorizon-backend

            echo "EC2 #2 deployment completed."s