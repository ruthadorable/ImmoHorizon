
name: Test Project
on:
  push:
    branches: [ "main" ]
  
jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: node:20
    steps:
      - name: Install Chrome system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libnspr4 \
            libnss3 \
            libgbm1 \
            libasound2 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libatspi2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libpango-1.0-0 \
            libcairo2 \
            libglib2.0-0 \
            libx11-6 \
            libxcb1

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2
        id: setup-chrome

      - name: Verify Chrome installation
        run: |
          ${{ steps.setup-chrome.outputs.chrome-path }} --version
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Run Angular automated tests
        run: npm run test -- --watch=false --browsers=ChromeHeadlessCI
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Run Build Script
        run: npm run build